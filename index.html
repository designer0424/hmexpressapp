<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HM Express — Iniciar sesión</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%232F6FD6%27/%3E%3Ctext x=%2712%27 y=%2717%27 font-size=%2714%27 font-family=%27Arial%27 font-weight=%27bold%27 fill=%27white%27 text-anchor=%27middle%27%3EHM%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="icon-badge" id="login-icon"></div>
      <div class="brand">HM <span>EXPRESS</span></div>
      <div class="subtitle">SISTEMA DE DOMICILIOS</div>
    </div>

    <form id="login-form">
      <div class="field">
        <label for="login-username">Usuario</label>
        <input class="input" id="login-username" type="text" placeholder="tu.usuario" autocomplete="username" />
      </div>
      <div class="field">
        <label for="login-password">Contraseña</label>
        <input class="input" id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <div id="login-error" class="error-text"></div>
      <button type="submit" class="btn btn-primary btn-full" id="login-btn">Iniciar sesión</button>
    </form>

    <div style="margin-top:18px;font-size:12px;color:var(--gray);text-align:center;line-height:1.5">
      Acceso exclusivo para el equipo HM Express.<br />Solicita tu usuario al administrador.
    </div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>
<script src="utils.js"></script>
<script src="auth.js"></script>
<script>
  document.getElementById("login-icon").innerHTML = icon("bike", 28, "#2F6FD6");
  initLoginForm();
</script>
</body>
</html>
